        - heading "Linked List Operations" [level=5] [ref=f3e23]
        - paragraph [ref=f3e24]: "1. Append - Add Element at the tail (last) 2. Prepend - Add Element at the head (top) 3. Insert - Insert Element on specific Index 4. Head - Return the head element 5. Tail - Return the tail element 6. Delete Tail - Delete the last element 7. Delete Head - Delete the top element 8. Delete Index - Delete the element by index # 9. Update - Update the element value using the address 10. Replace - Update the element value and address 11. Clear - Delete entire linked list 12. Display - Return the linked list 13. Size - Display the linked list size 14. Reverse - Reverse the order of Linked List 15. Find - Search the element using the address and return the value 16. Sort - Sort the linked list from lowest to highest (or from A-B) 17. isEmpty - Return True / False 18. isFull - Return True / False"
